name: Node.js CI

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  ci:
    name: Continuous Integration
    permissions:
      contents: read # for checkout
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false # Audit before installing dependencies
          runtime: node@${{ matrix.node }}

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate --prod

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures for installed packages
        run: pnpm audit signatures

      - name: Linting
        run: pnpm lint

      - name: Type checking
        run: pnpm typecheck

      - name: Spell checking
        run: pnpm spellcheck

      - name: Testing
        run: pnpm coverage

      - name: Building
        run: pnpm build

  sarif:
    name: SARIF Report
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      security-events: write # for uploading SARIF report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true

      - name: Building
        run: pnpm build

      - name: Generate SARIF report
        continue-on-error: true
        run: pnpm validate --check --info --reporter sarif > report.sarif.json

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: report.sarif.json
