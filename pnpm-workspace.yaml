allowBuilds:
  esbuild: true
  unrs-resolver: true

audit:
  ignorePrune: true

auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249 # minimatch <11.0.1 via @npmcli/arborist; minimatch override breaks linting

autoInstallPeers: true

enablePrePostScripts: true

minimumReleaseAge: 2880 # 2 day

minimumReleaseAgeExcludePrune: true

overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2

update:
  githubActions: true
